name: animoo
description: "A new Flutter project."
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.3.0
  go_router: ^17.3.0
  flutter_native_splash: ^2.4.8
  dotted_border: ^3.1.0
  pinput: ^6.0.2
  image_picker: ^1.2.3
  image_cropper: ^12.2.1
  get_it: ^9.2.1
  injectable: ^3.0.0
  dio: ^5.11.0
  connectivity_plus: ^7.3.1
  flutter_dotenv: ^6.0.1
  provider: ^6.1.5+1
  toastification: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  injectable_generator: ^3.1.1
  build_runner: ^2.15.1


flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/icons/
    - assets/images/
    - assets/splash/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/poppins/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/poppins/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/poppins/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/poppins/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/poppins/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/poppins/Poppins-ExtraBold.ttf
          weight: 800

    - family: Otamaep
      fonts:
        - asset: assets/fonts/otamaep/Otama-ep.otf
